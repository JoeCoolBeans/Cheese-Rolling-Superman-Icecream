<!DOCTYPE html>
<!-- DailyDashboard v43 — bump this (and the matching footer text) by 1 on every future update -->
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='1.44' y='1.44' width='21.12' height='21.12' rx='5.28' fill='%23020308'/%3E%3Cpath fill='%234fd9c7' d='M12,2.4 L13.49,10.51 L21.6,12 L13.49,13.49 L12,21.6 L10.51,13.49 L2.4,12 L10.51,10.51 Z'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#020308">
<meta name="robots" content="noindex, nofollow">
<title>Daily Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --rim-base:rgba(255,255,255,0.1); --rim-crisp:rgba(255,255,255,0.3); --rim-soft:rgba(255,255,255,0.16); --rim-dim:rgba(0,0,0,0.28);
    --glass-bg:rgba(255,255,255,0.03); --glass-bg-hover:rgba(255,255,255,0.055);
    --glass-border:rgba(255,255,255,0.2); --glass-border-hover:rgba(255,255,255,0.4);
    --sheen:rgba(255,255,255,0.14); --grid-line:rgba(255,255,255,0.045);
    --outer-shadow:rgba(0,0,0,0.4); --outer-shadow-hover:rgba(0,0,0,0.5);
    --icon-badge-bg:rgba(79,217,199,0.12);
    --clock-tick:rgba(255,255,255,0.55); --clock-hand:#f1f4fb;
  }
  html[data-theme="light"]{
    color-scheme:light;
    --rim-base:rgba(20,22,35,0.06); --rim-crisp:rgba(255,255,255,0.8); --rim-soft:rgba(255,255,255,0.55); --rim-dim:rgba(20,22,35,0.1);
    --glass-bg:rgba(255,255,255,0.3); --glass-bg-hover:rgba(255,255,255,0.46);
    --glass-border:rgba(20,22,35,0.12); --glass-border-hover:rgba(20,22,35,0.22);
    --sheen:rgba(255,255,255,0.6); --grid-line:rgba(20,22,35,0.07);
    --outer-shadow:rgba(30,34,60,0.12); --outer-shadow-hover:rgba(30,34,60,0.18);
    --icon-badge-bg:rgba(79,217,199,0.14);
    --clock-tick:rgba(20,22,35,0.5); --clock-hand:#14161f;
    background:#eef0f4;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,sans-serif;
    background-attachment:fixed;
    transition:background .3s ease, color .3s ease;
  }
  html:not([data-theme="light"]) body{
    background:
      radial-gradient(1200px 700px at 6% -8%, rgba(139,124,246,0.12), transparent 58%),
      radial-gradient(1000px 640px at 105% 4%, rgba(45,212,200,0.11), transparent 55%),
      radial-gradient(700px 500px at 50% 45%, rgba(10,132,255,0.07), transparent 60%),
      linear-gradient(180deg, #020308 0%, #060810 100%);
    background-attachment:fixed;
  }
  html[data-theme="light"] body{
    background:
      radial-gradient(1100px 800px at 8% -8%, rgba(255,255,255,0.55), transparent 58%),
      radial-gradient(900px 700px at 100% 105%, rgba(50,55,72,0.28), transparent 60%),
      linear-gradient(135deg, #c5c9d3 0%, #a9aebd 38%, #8b92a4 72%, #6d7488 100%);
    background-attachment:fixed;
  }
  html[data-theme="light"] .orb{ display:none; }
  .orb{position:fixed;border-radius:50%;filter:blur(85px);pointer-events:none;z-index:0;}
  .orb1{width:460px;height:460px;background:#8b7cf6;opacity:.28;top:-160px;left:-130px;}
  .orb2{width:420px;height:420px;background:#2dd4c8;opacity:.24;bottom:-170px;right:-110px;}
  .orb3{width:340px;height:340px;background:#f472a0;opacity:.18;top:55%;right:8%;}
  .orb4{width:300px;height:300px;background:#f7b955;opacity:.16;bottom:10%;left:6%;}

  .grid-overlay{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size:20px 20px;
  }

  .glass{
    background:var(--glass-bg);
    backdrop-filter:blur(24px) saturate(170%);
    -webkit-backdrop-filter:blur(24px) saturate(170%);
    border:1px solid var(--glass-border);
    box-shadow:
      inset 0 0 0 1px var(--rim-base),
      inset 0.5px 0.5px 0 0 var(--rim-crisp),
      inset 1.5px 1.5px 6px 0 var(--rim-soft),
      inset -0.5px -0.5px 0 0 var(--rim-dim),
      0 18px 40px var(--outer-shadow);
    position:relative;
    transition:transform .4s cubic-bezier(.22,1,.36,1), box-shadow .4s ease, border-color .4s ease, backdrop-filter .4s ease, background .4s ease;
    isolation:isolate;
  }
  .glass::before{
    content:"";position:absolute;inset:0;border-radius:inherit;
    background:linear-gradient(135deg, var(--sheen), rgba(255,255,255,0) 55%);
    pointer-events:none;z-index:0;
  }
  .glass > *{position:relative;z-index:1;}
  #analog-clock{ width:60px; height:60px; flex-shrink:0; }
  #analog-clock .tick{ stroke:var(--clock-tick); stroke-width:2.4; stroke-linecap:round; }
  #analog-clock .hour-hand{ stroke:var(--clock-hand); stroke-width:2.8; stroke-linecap:round; }
  #analog-clock .minute-hand{ stroke:var(--clock-hand); stroke-width:2.1; stroke-linecap:round; }
  #analog-clock .center-dot{ fill:#ffffff; }
  /* Lightweight glass variant for small pills whose text is set directly
     via textContent (the header stat counters) — no wrapping child element
     exists for a `.glass > *` z-index rule to lift above the sheen overlay,
     so this skips the sheen/::before entirely rather than fighting that. */
  .mini-pill{
    background:var(--glass-bg);
    backdrop-filter:blur(16px) saturate(150%);
    -webkit-backdrop-filter:blur(16px) saturate(150%);
    border:1px solid var(--glass-border);
  }
  .glass-hover:hover{
    transform:translateY(-8px) scale(1.015);
    border-color:var(--glass-border-hover);
    background:var(--glass-bg-hover);
    backdrop-filter:blur(34px) saturate(190%);
    -webkit-backdrop-filter:blur(34px) saturate(190%);
    box-shadow:
      inset 0 0 0 1px var(--rim-base),
      inset 0.75px 0.75px 0 0 var(--rim-crisp),
      inset 2px 2px 8px 0 var(--rim-soft),
      inset -0.75px -0.75px 0 0 var(--rim-dim),
      0 26px 52px var(--outer-shadow-hover);
  }
  .icon-badge{
    background:var(--icon-badge-bg);
    backdrop-filter:blur(6px) saturate(160%); -webkit-backdrop-filter:blur(6px) saturate(160%);
    box-shadow:
      inset 0 0 0 1px var(--rim-base),
      inset 0.4px 0.4px 0 0 var(--rim-crisp),
      inset 1px 1px 3px 0 var(--rim-soft);
    border:1px solid var(--glass-border);
  }

  .expand-pill{
    height:44px; border-radius:22px; display:flex; align-items:center; overflow:hidden;
    cursor:pointer; width:44px; box-shadow:0 8px 24px rgba(0,0,0,0.35);
    transition:width .3s cubic-bezier(.22,1,.36,1), background .3s ease, box-shadow .3s ease, border-color .3s ease;
  }
  /* Hover width is set per-element via --expand-width (computed in JS from
     the actual label text), not a guessed fixed number — otherwise shorter
     labels leave dead space and longer ones risk clipping. 120px/210px below
     are only a fallback in case JS hasn't run yet. */
  .expand-pill:hover{ width:var(--expand-width, 120px); }

  /* Positioning for the three floating buttons — written as plain CSS
     rather than Tailwind's `fixed`/`top-[Npx]`/`right-5` utility classes on
     purpose. An isolated test using hand-written CSS measured these exact
     offsets as perfectly equal (12px gaps both times), while the same
     values via Tailwind's arbitrary-value utilities did not render
     correctly inside the full page — so this sidesteps whatever about
     Tailwind's JIT class generation was interfering, rather than trying to
     find and fix it. */
  .floating-btn{ position:fixed; right:20px; z-index:50; }
  #refresh-btn{ top:20px; }
  #last-updated-wrapper{ top:76px; }
  #theme-toggle{ top:132px; }
  .expand-pill .icon{ width:42px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .expand-pill .label{ font-size:12px; white-space:nowrap; opacity:0; transition:opacity .2s ease .08s; padding-right:16px; }
  .expand-pill:hover .label{ opacity:1; }

  @keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  .spinning{ animation:spin 0.9s linear infinite; }
  .ring-progress{ transition:stroke-dashoffset 1s cubic-bezier(.22,1,.36,1); }
  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.15); border-radius:6px; }
  ::-webkit-scrollbar-thumb:hover{ background:rgba(255,255,255,0.25); }
  html::-webkit-scrollbar-track, body::-webkit-scrollbar-track{ background:#060810; }
  html[data-theme="light"]::-webkit-scrollbar-track, html[data-theme="light"] body::-webkit-scrollbar-track{ background:#dfe2e9; }
  html[data-theme="light"] ::-webkit-scrollbar-thumb{ background:rgba(20,22,35,0.18); }
  html[data-theme="light"] ::-webkit-scrollbar-thumb:hover{ background:rgba(20,22,35,0.28); }
  *{ scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.15) transparent; }
  html[data-theme="light"] *{ scrollbar-color: rgba(20,22,35,0.18) transparent; }
  .daytab{ transition:all .2s ease; }
  /* A clear accent-colored active state instead of a near-invisible tone-
     on-tone overlay — that version wasn't distinct enough in dark mode and
     rendered inconsistently in light mode, so one rule now covers both. */
  .daytab.active{ font-weight:700; color:var(--text-primary); }

  /* Date/time inputs: use the browser's built-in theme (matching light/dark
     mode) for the native picker popup — CSS can't restyle that popup
     directly, but color-scheme tells the browser which variant to render. */
  input[type="date"], input[type="time"]{
    color-scheme: dark;
    cursor: pointer;
  }
  html[data-theme="light"] input[type="date"], html[data-theme="light"] input[type="time"]{
    color-scheme: light;
  }
  input[type="date"]::-webkit-calendar-picker-indicator,
  input[type="time"]::-webkit-calendar-picker-indicator{
    filter: invert(0.7);
    cursor: pointer;
    opacity: 0.8;
    transition: opacity .15s ease, filter .15s ease;
  }
  html[data-theme="light"] input[type="date"]::-webkit-calendar-picker-indicator,
  html[data-theme="light"] input[type="time"]::-webkit-calendar-picker-indicator{
    filter: invert(0.35);
  }
  input[type="date"]:hover::-webkit-calendar-picker-indicator,
  input[type="time"]:hover::-webkit-calendar-picker-indicator{
    opacity: 1;
  }

  /* ============================================================
     Light-mode overrides for the existing dark-first Tailwind utility
     classes used throughout (text-slate-*, bg-white/*, border-white/*,
     etc.). Using attribute selectors ([class*="..."]) rather than literal
     class selectors sidesteps having to escape the slashes/brackets/dots
     in Tailwind's class names, and touches nothing in the HTML/JS itself —
     every existing class name, and any JS that references them, is
     completely untouched. !important guards against load-order ties with
     Tailwind's own injected stylesheet.
     ============================================================ */
  html[data-theme="light"] [class*="text-slate-100"]{ color:#14161f !important; }
  html[data-theme="light"] [class*="text-slate-200"]{ color:#20222c !important; }
  html[data-theme="light"] [class*="text-slate-300"]{ color:#2b2e3a !important; }
  html[data-theme="light"] [class*="text-slate-400"]{ color:#4b5268 !important; }
  html[data-theme="light"] [class*="text-slate-500"]{ color:#5b6178 !important; }
  html[data-theme="light"] [class*="text-slate-600"]{ color:#7d8296 !important; }
  html[data-theme="light"] [class*="bg-slate-500"]{ background-color:#8b92a3 !important; }
  html[data-theme="light"] [class*="bg-slate-800"]{ background-color:#d7dae2 !important; }
  html[data-theme="light"] [class*="bg-white/[0.035]"]{ background-color:rgba(20,22,35,0.035) !important; }
  html[data-theme="light"] [class*="bg-white/5"]{ background-color:rgba(20,22,35,0.045) !important; }
  html[data-theme="light"] [class*="bg-white/10"]{ background-color:rgba(20,22,35,0.07) !important; }
  html[data-theme="light"] [class*="border-white/5"]{ border-color:rgba(20,22,35,0.06) !important; }
  html[data-theme="light"] [class*="border-white/10"]{ border-color:rgba(20,22,35,0.1) !important; }
  html[data-theme="light"] [class*="border-white/20"]{ border-color:rgba(20,22,35,0.16) !important; }
  html[data-theme="light"] [class*="border-white/25"]{ border-color:rgba(20,22,35,0.2) !important; }
  html[data-theme="light"] [class*="border-white/30"]{ border-color:rgba(20,22,35,0.24) !important; }
  html[data-theme="light"] [class*="hover:bg-white/10"]:hover{ background-color:rgba(20,22,35,0.07) !important; }
  html[data-theme="light"] [class*="hover:border-white/25"]:hover{ border-color:rgba(20,22,35,0.2) !important; }
  html[data-theme="light"] [class*="hover:border-white/30"]:hover{ border-color:rgba(20,22,35,0.24) !important; }
  html[data-theme="light"] [class*="focus:border-white/25"]:focus{ border-color:rgba(20,22,35,0.2) !important; }
  html[data-theme="light"] [class*="focus:border-white/30"]:focus{ border-color:rgba(20,22,35,0.24) !important; }
  html[data-theme="light"] [class*="placeholder-slate-600"]::placeholder{ color:#9198ab !important; }
  html[data-theme="light"] [class*="text-emerald-300"]{ color:#0f7a5c !important; }
  html[data-theme="light"] [class*="text-emerald-400"]{ color:#0a6b4f !important; }
  html[data-theme="light"] [class*="text-rose-300"]{ color:#a13355 !important; }
  html[data-theme="light"] [class*="text-rose-400"]{ color:#8a2244 !important; }
</style>
</head>
<body class="min-h-screen text-slate-100 px-2 py-3 md:px-3 md:py-5 relative overflow-x-hidden">

<div class="grid-overlay"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>
<div class="orb orb4"></div>

<!-- These three floating buttons live here, OUTSIDE .wrap, on purpose. They
     used to be inside the space-y-4 wrapper below, and Tailwind's space-y-4
     silently adds margin-top to every child except the first one — even to
     position:fixed elements, since margin still applies to fixed elements
     regardless of them being taken out of normal document flow for
     positioning purposes. That meant two of the three buttons were getting
     an uninvited +16px stacked onto their intended position and one wasn't,
     which is what was actually causing the uneven gap between them — not
     anything about how their `top` values were being set. -->
<!-- Refresh button -->
<button id="refresh-btn"
  class="expand-pill glass floating-btn text-slate-300"
  title="Refresh live data">
  <span class="icon">
    <svg id="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
      <polyline points="23 4 23 10 17 10"></polyline>
      <polyline points="1 20 1 14 7 14"></polyline>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
    </svg>
  </span>
  <span class="label">Refresh</span>
</button>

<!-- Last updated pill (sits directly below refresh). The status dot lives
     OUTSIDE the pill itself, in this wrapper — the pill has overflow:hidden
     to clip its label text while collapsed, and a circular clip cuts in
     hardest right at the corners, so anything positioned near a corner
     (even "inside" the box) still gets cut off. Anchoring the dot to this
     unclipped wrapper via `right` also means it stays visually pinned in
     place as the pill grows wider on hover, instead of drifting into the
     label text. -->
<div id="last-updated-wrapper" class="floating-btn">
  <div id="last-updated-bubble"
    class="expand-pill glass text-slate-300"
    title="Not yet refreshed">
    <span class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 text-slate-400">
        <circle cx="12" cy="12" r="9"></circle>
        <polyline points="12 7 12 12 15 14"></polyline>
      </svg>
    </span>
    <span id="last-updated-label" class="label">Not yet refreshed</span>
  </div>
  <span id="last-updated-dot" class="absolute top-0.5 right-0.5 w-2.5 h-2.5 rounded-full bg-slate-500 transition-colors duration-300 pointer-events-none"></span>
</div>

<!-- Theme toggle -->
<button id="theme-toggle"
  class="expand-pill glass floating-btn text-slate-300"
  title="Switch theme">
  <span class="icon">
    <svg id="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
    <svg id="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 hidden">
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
    </svg>
  </span>
  <span id="theme-toggle-label" class="label">Dark mode</span>
</button>

<div class="max-w-6xl mx-auto space-y-4 relative z-10">

  <!-- Header: greeting + date + weather (left) / quick stats (right) -->
  <header id="dashboard-header" class="glass glass-hover rounded-3xl flex flex-wrap items-center justify-between gap-4" style="padding:12px 14px 12px 22px;">
    <div id="greeting-block">
      <h1 id="greeting-text" class="text-2xl md:text-3xl font-semibold tracking-tight">Good day</h1>
      <div style="margin-top:10px;padding-left:10px;border-left:2px solid rgba(79,217,199,0.85);">
        <p class="text-slate-200 text-sm font-medium flex items-center gap-2">
          <span id="weekday-text">–</span>
          <span class="text-slate-500">|</span>
          <span id="monthday-text">–</span>
        </p>
        <div class="flex items-center gap-2 mt-1.5 text-xs font-normal">
          <span id="weather-emoji" class="w-4 h-4 text-slate-300 flex-shrink-0"></span>
          <span id="weather-temp" class="font-semibold text-slate-100">--°</span>
          <span class="text-slate-500">·</span>
          <span id="weather-cond" class="text-slate-300 text-[11px]">Fetching weather…</span>
          <span class="text-slate-500">·</span>
          <span id="weather-city" class="text-slate-400 text-[11px]">Loading location…</span>
        </div>
      </div>
    </div>

    <svg id="analog-clock" class="flex-shrink-0" viewBox="0 0 100 100"></svg>
  </header>

  <!-- Schedule -->
  <section>
    <h2 class="text-xs uppercase tracking-widest text-slate-500 font-semibold mb-4 ml-1">Schedule</h2>
    <div class="flex gap-2 mb-4">
      <button class="daytab active px-4 py-2 rounded-full text-sm font-medium glass" data-day="today">Today</button>
      <button class="daytab px-4 py-2 rounded-full text-sm font-medium glass" data-day="tomorrow">Tomorrow</button>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-[2fr_1fr] gap-4" id="schedule-grid"></div>
  </section>

  <!-- Priority action items / Recent Drive files / Scratchpad -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <section class="flex flex-col">
      <h2 class="text-xs uppercase tracking-widest text-slate-500 font-semibold mb-4 ml-1">Priority action items</h2>
      <div class="glass glass-hover rounded-3xl p-5 h-[380px] overflow-hidden">
        <div id="priority-card" class="h-full overflow-y-auto pr-1"></div>
      </div>
    </section>

    <section class="flex flex-col">
      <h2 class="text-xs uppercase tracking-widest text-slate-500 font-semibold mb-4 ml-1">Countdown</h2>
      <div class="glass glass-hover rounded-3xl p-5 h-[380px] flex flex-col overflow-hidden">
        <input id="countdown-title" type="text" maxlength="60" placeholder="Countdown title…"
          class="bg-transparent border-0 border-b border-white/10 focus:border-white/30 outline-none text-base font-semibold text-slate-100 placeholder-slate-600 pb-1.5 flex-shrink-0">

        <div class="flex gap-2 mt-3 flex-shrink-0">
          <input id="countdown-start" type="date" class="flex-1 bg-white/5 border border-white/10 rounded-lg px-2 h-8 text-xs text-slate-200 outline-none focus:border-white/30 cursor-pointer">
          <input id="countdown-end" type="date" class="flex-1 bg-white/5 border border-white/10 rounded-lg px-2 h-8 text-xs text-slate-200 outline-none focus:border-white/30 cursor-pointer">
        </div>

        <div class="flex items-baseline gap-2 mt-3 flex-shrink-0">
          <span id="countdown-days-left" class="text-2xl font-bold text-slate-100">–</span>
          <span class="text-xs text-slate-500">days left</span>
          <span id="countdown-days-completed" class="text-[11px] text-slate-500 ml-auto"></span>
        </div>

        <div id="countdown-dots" class="flex-1 min-h-0 overflow-y-auto mt-3 flex flex-wrap content-start gap-1.5 pr-1"></div>
      </div>
    </section>

    <section class="flex flex-col">
      <h2 class="text-xs uppercase tracking-widest text-slate-500 font-semibold mb-4 ml-1">Scratchpad</h2>
      <div class="glass glass-hover rounded-3xl p-5 h-[380px] flex flex-col">
        <div class="flex justify-between items-center mb-2 flex-shrink-0">
          <span class="text-[11px] text-slate-500">Autosaves as you type</span>
          <span id="save-indicator" class="text-[11px] text-slate-500 flex items-center gap-1.5 transition-opacity duration-300">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>Saved
          </span>
        </div>
        <div class="flex gap-1.5 mb-2 flex-shrink-0">
          <button type="button" id="scratchpad-bullet" title="Insert bullet"

// Inserts a prefix (bullet or checkbox) at the cursor. If the cursor isn't
// already at the start of a line, a newline is added first so the prefix
// always begins its own line.
function insertScratchpadPrefix(prefix){
  const ta = document.getElementById('scratchpad');
  const start = ta.selectionStart;
  const end = ta.selectionEnd;
  const value = ta.value;
  const atLineStart = start === 0 || value[start - 1] === '\n';
  const insertText = (atLineStart ? '' : '\n') + prefix;
  ta.value = value.slice(0, start) + insertText + value.slice(end);
  const newPos = start + insertText.length;
  ta.selectionStart = ta.selectionEnd = newPos;
  ta.focus();
  ta.dispatchEvent(new Event('input')); // reuses the existing autosave listener above
}

  const x2 = 50 + innerR * Math.sin(angle), y2 = 50 - innerR * Math.cos(angle);
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line.setAttribute('x1', x1); line.setAttribute('y1', y1);
  line.setAttribute('x2', x2); line.setAttribute('y2', y2);
  line.setAttribute('class', 'tick');
  clockSvg.appendChild(line);
}
const clockHourHand = document.createElementNS('http://www.w3.org/2000/svg', 'line');
clockHourHand.setAttribute('x1', 50); clockHourHand.setAttribute('y1', 50);
clockHourHand.setAttribute('x2', 50); clockHourHand.setAttribute('y2', 26);

clockMinuteHand.setAttribute('x2', 50); clockMinuteHand.setAttribute('y2', 14);

function sizeAnalogClock(){

  const greetingEl = document.getElementById('greeting-block');

  clockHourHand.setAttribute('transform', `rotate(${(hours + minutes / 60) * 30} 50 50)`);
  clockMinuteHand.setAttribute('transform', `rotate(${(minutes + seconds / 60) * 6} 50 50)`);
}

  body.querySelectorAll('.task-checkbox').forEach(btn => {

// Optimistic UI: the task disappears from the list immediately on click
// rather than waiting for the network round-trip, since this should feel
// instant. If the server call actually fails, it's put back and an error
// shown — quietly, since a failed checkbox click isn't worth interrupting
// someone over, but it shouldn't just silently lose the click either.
async function completeTaskAction(index){
  const task = liveIncompleteTasks[index];
  if(!task || !task.taskId || !task.tasklistId){
    console.error('Task is missing taskId/tasklistId — cannot complete it.', task);
    return;
  }

  liveIncompleteTasks = liveIncompleteTasks.filter((_, i) => i !== index);
  renderTasksColumn();

  try{
    const res = await fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'completeTask', taskId: task.taskId, tasklistId: task.tasklistId, key: DASHBOARD_KEY })
    });
    const data = await res.json();
    if(!data.success){
      throw new Error(data.error || 'Unknown error completing task.');
    }
  }catch(err){
    // Re-add just this one task rather than restoring a full snapshot of
    // the old array — if a refresh happened to land while this request was
    // in flight, liveIncompleteTasks may have already moved on, and a full
    // snapshot restore would clobber that instead of just undoing this
    // one failed click.
    console.error('Failed to complete task:', err);
    if(!liveIncompleteTasks.some(t => t.taskId === task.taskId)){
      liveIncompleteTasks = [task, ...liveIncompleteTasks];
    }
    renderTasksColumn();
  }
}

function parseTimeToMinutes(str){
  if(!str) return null;
  const match = str.match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
  if(!match) return null;
  let h = parseInt(match[1], 10);
  const m = parseInt(match[2], 10);
  const ampm = match[3].toUpperCase();
  if(ampm === 'PM' && h !== 12) h += 12;
  if(ampm === 'AM' && h === 12) h = 0;
  return h * 60 + m;
}

// shown on the Today tab, since "next up" as a concept doesn't really
// apply to tomorrow the same way. All-day events aren't eligible for this
// slot since they're not time-urgent the way a scheduled item is.
function nextUpItemHtml(time, title, sub, dotColor){
  const dot = dotColor ? `<span class="inline-block w-2 h-2 rounded-full mr-2 flex-shrink-0" style="background:${dotColor};"></span>` : '';
  return `<div class="bg-white/[0.05] border rounded-xl px-3.5 py-3" style="border-color:rgba(79,217,199,0.3);">

}

function renderCalendarColumn(day){
  const body = document.getElementById('body-calendar');
  const count = document.getElementById('count-calendar');
  if(!body) return;

  let events = (day === 'today' ? liveEventsToday : liveEventsTomorrow)
    .filter(e => e.category === 'work' || e.category === 'personal');

  // Drop events that have already ended today, then sort so all-day events
  // stay pinned at top, followed by soonest-upcoming first — same logic
  // that used to apply separately to each of the two columns this replaced.
  if(day === 'today'){
    const now = new Date();
    const nowMinutes = now.getHours() * 60 + now.getMinutes();
    events = events.filter(ev => {
      if(ev.isAllDay) return true;
      const endMinutes = parseTimeToMinutes(ev.endTime) ?? parseTimeToMinutes(ev.startTime);
      return endMinutes === null || endMinutes >= nowMinutes;
    });
  }
  events = events.slice().sort((a, b) => {
    if(a.isAllDay && !b.isAllDay) return -1;
    if(!a.isAllDay && b.isAllDay) return 1;
    if(a.isAllDay && b.isAllDay) return 0;
    const aStart = parseTimeToMinutes(a.startTime) ?? 9999;
    const bStart = parseTimeToMinutes(b.startTime) ?? 9999;
    return aStart - bStart;
  });

  count.textContent = events.length ? events.length : '';
  if(events.length === 0){
    const sub = (day === 'tomorrow' && !tomorrowDataLoaded)
      ? "Waiting on your Apps Script to include eventsTomorrow — hit refresh once it's redeployed."
      : `Nothing on the calendar for ${day}.`;
    body.innerHTML = emptyStateHtml(ICONS.calendar, 'Nothing here', sub);
  } else {
    const nextUpIndex = day === 'today' ? events.findIndex(ev => !ev.isAllDay) : -1;
    body.innerHTML = events.map((ev, i) => {
      const color = CATEGORY_META[ev.category]?.color;
      return i === nextUpIndex
        ? nextUpItemHtml(ev.time || '', ev.title, ev.sub || '', color)
        : eventItemHtml(ev.time || '', ev.title, ev.sub || '', color);
    }).join('');
  }
}

// ================== COUNTDOWN (fully client-side — no Apps Script needed) ==================
function isoToUtcMs(iso){
  const [y, m, d] = iso.split('-').map(Number);
  return Date.UTC(y, m - 1, d);
}
function daysBetween(isoA, isoB){
  return Math.round((isoToUtcMs(isoB) - isoToUtcMs(isoA)) / 86400000);
}
function localIso(d){
  const yyyy = d.getFullYear(), mm = String(d.getMonth() + 1).padStart(2, '0'), dd = String(d.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}

// Finds the largest dot size (and matching gap) that lets all `count` dots
// fit inside the container's actual current width/height without wrapping
// into more rows than fit — so the grid scales down automatically for long
// countdowns instead of requiring a scroll. Falls back to the smallest size
// (and lets the container's own overflow-y-auto kick in as a safety net)
// for extreme ranges where even that can't fit everything.
function sizeDotsToFit(container, count){
  const W = container.clientWidth;
  const H = container.clientHeight;
  const maxSize = 10, minSize = 2;

  if(!W || !H || count <= 0) return { size: maxSize, gap: 6 };

  for(let size = maxSize; size >= minSize; size -= 0.25){
    const gap = Math.max(1.5, Math.min(6, size * 0.5));
    const perRow = Math.max(1, Math.floor((W + gap) / (size + gap)));
    const rows = Math.ceil(count / perRow);
    const neededHeight = rows * (size + gap) - gap;
    if(neededHeight <= H){
      return { size, gap };
    }
  }
  return { size: minSize, gap: 1.5 };
}

function renderCountdown(){
  const startVal = document.getElementById('countdown-start').value;
  const endVal = document.getElementById('countdown-end').value;
  const dotsEl = document.getElementById('countdown-dots');
  const leftEl = document.getElementById('countdown-days-left');
  const doneEl = document.getElementById('countdown-days-completed');

  if(!startVal || !endVal){
    dotsEl.innerHTML = `<div class="text-center text-slate-500 text-xs py-4 w-full">Set a start and end date to begin.</div>`;
    leftEl.textContent = '–';
    doneEl.textContent = '';
    return;
  }

  const totalDays = daysBetween(startVal, endVal) + 1; // inclusive of both start and end dates
  if(totalDays <= 0){
    dotsEl.innerHTML = `<div class="text-center text-rose-400 text-xs py-4 w-full">End date must be after start date.</div>`;
    leftEl.textContent = '–';
    doneEl.textContent = '';
    return;
  }

  const todayIso = localIso(new Date());
  let elapsed = daysBetween(startVal, todayIso); // days strictly before today = "completed"
  elapsed = Math.max(0, Math.min(elapsed, totalDays));
  const daysLeft = totalDays - elapsed;

  leftEl.textContent = daysLeft;
  doneEl.textContent = `${elapsed} day${elapsed === 1 ? '' : 's'} completed`;

  const { size, gap } = sizeDotsToFit(dotsEl, totalDays);
  dotsEl.style.gap = gap + 'px';

  let dotsHtml = '';
  for(let i = 0; i < totalDays; i++){
    const filled = i < elapsed;
    dotsHtml += `<span style="width:${size}px;height:${size}px;" class="rounded-full flex-shrink-0 ${filled ? 'bg-emerald-400' : 'bg-white/10 border border-white/20'}"></span>`;
  }
  dotsEl.innerHTML = dotsHtml;
}

// ================== UTILITIES ==================
function escapeHTML(str){
  return String(str).replace(/[&<>'"]/g, tag => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[tag] || tag));
}

// ================== GOOGLE CALENDAR & TASKS ==================
async function fetchGoogleData(){
  if(!GOOGLE_SCRIPT_URL) return;
  const response = await fetch(`${GOOGLE_SCRIPT_URL}?key=${encodeURIComponent(DASHBOARD_KEY)}`, { cache: 'no-store' });
  if(!response.ok) throw new Error('Apps Script request failed: ' + response.status);
  const data = await response.json();

  liveEventsToday = Array.isArray(data.eventsToday) ? data.eventsToday.map(ev => ({
    time: ev.isAllDay ? 'All day' : `${ev.startTime || ''}${ev.endTime ? ' – ' + ev.endTime : ''}`,
    title: ev.title || 'Untitled event',
    isAllDay: !!ev.isAllDay,
    startTime: ev.startTime || '',
    endTime: ev.endTime || '',
    category: ev.category === 'work' ? 'work' : 'personal'
  })) : [];

  if(Array.isArray(data.eventsTomorrow)){
    tomorrowDataLoaded = true;
    liveEventsTomorrow = data.eventsTomorrow.map(ev => ({
      time: ev.isAllDay ? 'All day' : `${ev.startTime || ''}${ev.endTime ? ' – ' + ev.endTime : ''}`,
      title: ev.title || 'Untitled event',
      isAllDay: !!ev.isAllDay,
      startTime: ev.startTime || '',
      endTime: ev.endTime || '',
      category: ev.category === 'work' ? 'work' : 'personal'
    }));
  } else {
    tomorrowDataLoaded = false;
    liveEventsTomorrow = [];
  }

  liveIncompleteTasks = Array.isArray(data.incompleteTasks) ? data.incompleteTasks.map(t => {
    let dateLabel = '';
    if(t.due){
      const d = new Date(t.due);
      dateLabel = isNaN(d) ? String(t.due) : d.toLocaleDateString('en-US', {month:'short', day:'numeric'});
    }
    return { date: dateLabel, title: t.title || 'Untitled task', sub: t.notes || '', taskId: t.taskId, tasklistId: t.tasklistId };
  }) : [];

  renderPriorityItems(Array.isArray(data.priorityEmails) ? data.priorityEmails : []);

  renderTasksColumn();
  renderCalendarColumn(activeDay);
}

// ================== WEATHER (Open-Meteo) ==================
function weatherDescription(code){
  const map = {
    0:'Clear sky', 1:'Mainly clear', 2:'Partly cloudy', 3:'Overcast', 45:'Foggy', 48:'Foggy',
    51:'Light drizzle', 53:'Drizzle', 55:'Dense drizzle', 61:'Slight rain', 63:'Rain', 65:'Heavy rain',
    71:'Slight snow', 73:'Snow', 75:'Heavy snow', 80:'Rain showers', 81:'Rain showers', 82:'Violent showers',
    95:'Thunderstorm', 96:'Thunderstorm', 99:'Severe thunderstorm'
  };
  return map[code] || 'Fair';
}
const WEATHER_SVG = {
  sun: '<circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="12" y1="2" x2="12" y2="4.5"/><line x1="12" y1="19.5" x2="12" y2="22"/><line x1="2" y1="12" x2="4.5" y2="12"/><line x1="19.5" y1="12" x2="22" y2="12"/><line x1="4.5" y1="4.5" x2="6.2" y2="6.2"/><line x1="17.8" y1="17.8" x2="19.5" y2="19.5"/><line x1="4.5" y1="19.5" x2="6.2" y2="17.8"/><line x1="17.8" y1="6.2" x2="19.5" y2="4.5"/></g>',
  cloud: '<path fill="currentColor" d="M6 18a4.5 4.5 0 0 1 .3-9 6 6 0 0 1 11.4 1.9A4 4 0 0 1 17 18H6Z"/>',
  cloudSun: '<circle cx="8" cy="7" r="3" fill="currentColor" opacity="0.85"/><path fill="currentColor" d="M6.5 19a4 4 0 0 1 .2-8 5.4 5.4 0 0 1 10.3 1.7A3.6 3.6 0 0 1 16.5 19h-10Z"/>',
  rain: '<path fill="currentColor" d="M6 14a4.5 4.5 0 0 1 .3-9 6 6 0 0 1 11.4 1.9A4 4 0 0 1 17 14H6Z"/><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="8" y1="17" x2="7" y2="20.5"/><line x1="12" y1="17" x2="11" y2="20.5"/><line x1="16" y1="17" x2="15" y2="20.5"/></g>',
  snow: '<path fill="currentColor" d="M6 13a4.5 4.5 0 0 1 .3-9 6 6 0 0 1 11.4 1.9A4 4 0 0 1 17 13H6Z"/><g stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><line x1="8" y1="16" x2="8" y2="21"/><line x1="5.5" y1="17.3" x2="10.5" y2="19.7"/><line x1="10.5" y1="17.3" x2="5.5" y2="19.7"/><line x1="16" y1="16" x2="16" y2="21"/><line x1="13.5" y1="17.3" x2="18.5" y2="19.7"/><line x1="18.5" y1="17.3" x2="13.5" y2="19.7"/></g>',
  storm: '<path fill="currentColor" d="M6 12a4.5 4.5 0 0 1 .3-9 6 6 0 0 1 11.4 1.9A4 4 0 0 1 17 12H6Z"/><path fill="currentColor" d="m13 11-3 5.5h2.4L11 21l5-6h-2.6l1.3-2.3H13Z"/>'
};
function weatherIconSvg(code){
  let key = 'sun';
  if(code === 0) key = 'sun';
  else if(code === 1 || code === 2) key = 'cloudSun';
  else if(code === 3 || code === 45 || code === 48) key = 'cloud';
  else if([51,53,55,61,63,65,80,81,82].includes(code)) key = 'rain';
  else if([71,73,75].includes(code)) key = 'snow';
  else if([95,96,99].includes(code)) key = 'storm';
  return `<svg viewBox="0 0 24 24" class="w-full h-full">${WEATHER_SVG[key]}</svg>`;
}
async function fetchWeatherData(){
  // Geolocation removed on purpose — it re-prompted for permission on every
  // load when run as a local file. Using the fixed default location instead.
  const lat = DEFAULT_LAT, lon = DEFAULT_LON, locLabel = 'Steubenville, OH';
  document.getElementById('weather-city').textContent = locLabel;

  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=auto`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('Weather request failed: ' + res.status);
  const data = await res.json();
  const temp = Math.round(data.current_weather.temperature);
  const code = data.current_weather.weathercode;
  const high = Math.round(data.daily.temperature_2m_max[0]);
  const low = Math.round(data.daily.temperature_2m_min[0]);
  document.getElementById('weather-emoji').innerHTML = weatherIconSvg(code);
  document.getElementById('weather-temp').textContent = `${temp}°`;
  document.getElementById('weather-cond').textContent = `${weatherDescription(code)} · High ${high}° Low ${low}°`;
}

// ================== REFRESH ENGINE ==================
async function refreshAll(){
  const btn = document.getElementById('refresh-btn');
  const icon = document.getElementById('refresh-icon');
  icon.classList.add('spinning'); btn.disabled = true;

  const results = await Promise.allSettled([fetchGoogleData(), fetchWeatherData()]);
  const failed = results.filter(r => r.status === 'rejected');
  failed.forEach(f => console.error('Refresh error:', f.reason));

  // Countdown depends only on today's date, not on any network data, but
  // it was never re-run as part of this cycle — only on page load, on
  // manually editing the dates, or when the tab regains visibility. If the
  // page just sits open and visible across a day rollover, it would go
  // stale until something else triggered a re-render. Piggybacking it onto
  // the existing 15-minute timer fixes that with no extra timer needed.
  renderCountdown();

  icon.classList.remove('spinning'); btn.disabled = false;

  const now = new Date();
  let h = now.getHours(); const m = now.getMinutes().toString().padStart(2,'0');
  const ampm = h >= 12 ? 'PM' : 'AM'; h = h % 12; if(h === 0) h = 12;
  const stamp = `${h}:${m} ${ampm}`;
  const bubble = document.getElementById('last-updated-bubble');
  const dot = document.getElementById('last-updated-dot');
  const label = document.getElementById('last-updated-label');
  let statusText, shortText, dotColor;
  if(failed.length === 0){ statusText = `Last updated at ${stamp}`; shortText = `Updated ${stamp}`; dotColor = 'bg-emerald-400'; }
  else if(failed.length === results.length){ statusText = `Refresh failed at ${stamp} — try again`; shortText = `Failed ${stamp}`; dotColor = 'bg-rose-400'; }
  else { statusText = `Partially updated at ${stamp} (${results.length - failed.length}/${results.length} sources)`; shortText = `Partial ${stamp}`; dotColor = 'bg-amber-400'; }
  bubble.title = statusText;
  label.textContent = shortText;
  fitExpandPill(bubble, shortText);
  dot.className = `absolute top-0.5 right-0.5 w-2.5 h-2.5 rounded-full transition-colors duration-300 pointer-events-none ${dotColor}`;
}
document.getElementById('refresh-btn').addEventListener('click', refreshAll);

document.getElementById('qa-submit').addEventListener('click', async () => {
  const statusEl = document.getElementById('qa-status');
  const btn = document.getElementById('qa-submit');
  const title = document.getElementById('qa-title').value.trim();
  const date = document.getElementById('qa-date').value;
  const isAllDay = document.getElementById('qa-allday').checked;
  const startTime = document.getElementById('qa-start').value;
  const endTime = document.getElementById('qa-end').value;

  if(!title || !date){
    statusEl.textContent = 'Title and date are required.';
    statusEl.className = 'text-[11px] mt-2.5 min-h-[16px] text-rose-400';
    return;
  }
  if(!isAllDay && (!startTime || !endTime)){
    statusEl.textContent = 'Start and end time are required for a timed event.';
    statusEl.className = 'text-[11px] mt-2.5 min-h-[16px] text-rose-400';
    return;
  }

  const payload = {
    action: 'createEvent',
    title: title,
    isAllDay: isAllDay,
    start: isAllDay ? `${date}T00:00:00` : `${date}T${startTime}:00`,
    end: isAllDay ? `${date}T00:00:00` : `${date}T${endTime}:00`,
    calendar: document.getElementById('qa-calendar').value,
    key: DASHBOARD_KEY
  };

  btn.disabled = true;
  btn.textContent = 'Creating…';
  statusEl.textContent = '';

  try{
    const res = await fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids a CORS preflight against Apps Script
      body: JSON.stringify(payload)
    });
    const result = await res.json();
    if(result.success){
      statusEl.textContent = `"${title}" created.`;
      statusEl.className = 'text-[11px] mt-2.5 min-h-[16px] text-emerald-400';
      document.getElementById('qa-title').value = '';
      document.getElementById('qa-start').value = '';
      document.getElementById('qa-end').value = '';
      refreshAll();
    } else {
      statusEl.textContent = `Failed: ${result.error || 'unknown error'}`;
      statusEl.className = 'text-[11px] mt-2.5 min-h-[16px] text-rose-400';
    }
  }catch(err){
    statusEl.textContent = `Request failed: ${err.message}`;
    statusEl.className = 'text-[11px] mt-2.5 min-h-[16px] text-rose-400';
  }finally{
    btn.disabled = false;
    btn.textContent = 'Create event';
  }
});

// ================== EXPAND-PILL WIDTH FITTING ==================
// Measures each pill's actual label text (via a scratch canvas — no layout
// flicker, no DOM measurement tricks) and sets --expand-width to exactly
// icon + text + padding, so hovering only ever expands as far as that
// specific button's content actually needs. Must be re-run any time a
// label's text changes (timestamps, "Dark mode"/"Light mode", etc.).
const _measureCanvas = document.createElement('canvas');
const _measureCtx = _measureCanvas.getContext('2d');
function fitExpandPill(el, text){
  _measureCtx.font = '400 12px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Inter, sans-serif';
  const textWidth = _measureCtx.measureText(text).width;
  const iconWidth = 42;       // matches .expand-pill .icon{width:42px}
  const labelPadRight = 16;   // matches .expand-pill .label{padding-right:16px}
  const safetyBuffer = 4;     // small cushion for font-rendering rounding, not enough to read as "dead space"
  const total = Math.ceil(iconWidth + textWidth + labelPadRight + safetyBuffer);
  el.style.setProperty('--expand-width', total + 'px');
}

// ================== INIT ==================
fitExpandPill(document.getElementById('refresh-btn'), 'Refresh'); // static label, only needs setting once
loadTheme();
loadNotes();
loadLaunchers();
loadCountdown();
initQuickAddDefaults();
refreshAll();
setInterval(refreshAll, 15 * 60 * 1000);

// On mobile, tapping the installed app's icon after it's been backgrounded
// usually RESUMES the suspended page rather than doing a true reload — and
// while suspended, JS (including the interval timer above) is paused too.
// That's why things like the countdown and header stats could appear
// "frozen" across days without this: re-run everything date/data-sensitive
// whenever the page actually becomes visible again, which reliably fires
// on resume even when a full reload doesn't happen.
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible'){
    renderCountdown();
    refreshAll();
  }
});

// Registers the service worker so the app is installable / opens full-screen
// from the home screen. Harmless if hosted somewhere that doesn't support it.
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.error('Service worker registration failed:', err));
  });
}
